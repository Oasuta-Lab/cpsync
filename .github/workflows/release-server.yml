name: Release - Server

on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip source
        run: |
          zip -r cpsync-server-${{ github.ref_name }}.zip apps/server

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CpSync Server ${{ github.ref_name }}
          files: cpsync-server-${{ github.ref_name }}.zip
          generate_release_notes: true
