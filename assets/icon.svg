<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- Card — classic (prod) fill and border ring -->
  <rect x="24" y="24" width="976" height="976" rx="200" fill="#F0F1EA" stroke="#A3B18A" stroke-width="48"/>

  <!-- Three overlapping circles — exact logo colors -->
  <circle cx="262" cy="400" r="150" fill="#A3B18A"/>
  <circle cx="512" cy="400" r="150" fill="#8FA3B0"/>
  <circle cx="762" cy="400" r="150" fill="#E9A178"/>

  <!-- Red bar — sharp rectangle, full width -->
  <rect x="140" y="600" width="744" height="112" fill="#E35336"/>

  <!-- "CPSYNC" label inside the bar -->
  <text x="512" y="658"
        font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="64" font-weight="800" letter-spacing="8"
        fill="white" text-anchor="middle" dominant-baseline="central">CPSYNC</text>

</svg>
